name: Clonar tudo

on:
  schedule:
    - cron: '0 4 * * *'   # Execução automática diária às 04:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      # Ignora pushes gerados pelo próprio workflow para evitar loop infinito
      - 'SaimoPlayer/**'
      - 'canais-saimo/**'
      - 'filmes-saimo/**'

permissions:
  contents: write

concurrency:
  group: saimo-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete mirror
        run: python3 clonar.py

      - name: Commit mirrored content
        run: |
          git add SaimoPlayer canais-saimo filmes-saimo
          if git diff --cached --quiet; then
            echo "Sem alterações para commitar."
            exit 0
          fi
          git commit -m "chore(sync): mirror Saimo source and catalogs [skip ci]"
          git push origin HEAD:main

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Sincronização falhou — verifique o log do Actions para detalhes."
