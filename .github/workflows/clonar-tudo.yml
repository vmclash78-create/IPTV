name: Clonar e Sincronizar Prisma TV

on:
  schedule:
    - cron: '0 4 * * *'   # Execução diária automática às 04:00 UTC
  workflow_dispatch:        # Permite rodar manualmente no GitHub a qualquer momento
  push:
    branches:
      - main
    paths-ignore:
      - 'PrismaPlayer/**'
      - 'canais/**'
      - 'filmes/**'

permissions:
  contents: write

concurrency:
  group: prisma-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete mirror (Saimo -> Prisma TV)
        run: python3 clonar.py

      - name: Mirror public/openly licensed movie playlist
        run: python3 sincronizar_filmes_publicos.py

      - name: Aggregate multiple repositories (iptv-org + official streams)
        run: python3 agregar_fontes.py || true

      - name: Clean dead Saimo API URLs from movies and series
        run: python3 limpar_saimo_filmes.py --aplicar || true

      - name: Commit mirrored content
        run: |
          git add PrismaPlayer canais filmes
          if git diff --cached --quiet; then
            echo "Sem alterações para commitar."
            exit 0
          fi
          git commit -m "chore(sync): mirror Prisma source and catalogs [skip ci]"
          git push origin HEAD:main

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Sincronização falhou — verifique o log do Actions para detalhes."
