name: Sincronizar Prisma TV

on:
  schedule:
    - cron: '0 4 * * *'   # Diariamente às 04:00 UTC
  workflow_dispatch:        # Permite rodar manualmente no GitHub
  push:
    branches:
      - main
    paths-ignore:
      # Ignora pushes gerados pelo próprio workflow para evitar loop infinito
      - 'PrismaPlayer/**'
      - 'canais/**'
      - 'filmes/**'

permissions:
  contents: write

concurrency:
  group: prisma-sync
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sincronizar canais (iptv-org + manuais)
        run: python3 sincronizar.py

      - name: Commitar canais atualizados
        run: |
          git add canais/ filmes/
          if git diff --cached --quiet; then
            echo "Sem alterações nos canais."
          else
            git commit -m "chore(sync): atualiza catálogo de canais Prisma TV [skip ci]"
          fi

      - name: Publicar
        run: git push origin HEAD:main

      - name: Notificar falha
        if: failure()
        run: echo "::error::Sincronização falhou — verifique o log do Actions."
